name: Verify AURUM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6
        with:
          python-version: "3.12.7"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-runtime.lock
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Verify Python
        run: |
          ruff check .
          ruff format --check .
          mypy .
          pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # verified v7.1.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AURUM_API_TOKEN: synthetic-ci-token-only
      COMPOSE_PROJECT_NAME: aurum-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6
        with:
          persist-credentials: false
      - name: Validate and start isolated local services
        run: |
          mkdir -p data
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 120
      - name: Verify container health and access boundary
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/health)" = 401
          docker compose run --rm worker verify-store --verify-sources --verify-normalized
      - name: Verify synthetic data persistence and standalone assets
        run: python3 scripts/synthetic_container_smoke.py
      - name: Stop isolated CI services
        if: always()
        run: docker compose down --volumes --remove-orphans
